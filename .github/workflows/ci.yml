name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install cryptography pyyaml voluptuous pytest pytest-asyncio ruff
      - name: Ruff (lint)
        run: ruff check custom_components tools tests
      - name: Ruff (format)
        run: ruff format --check custom_components tools tests
      - name: Pytest
        run: pytest -q

  hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: home-assistant/actions/hassfest@master

  # Validates against the *default HACS store* criteria. Not required for a
  # custom repository install, so failures here are informational only.
  hacs:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4
      - uses: hacs/action@main
        with:
          category: integration
          ignore: brands
